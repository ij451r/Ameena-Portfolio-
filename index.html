<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ameena PK | Media, Communications and Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FB;--ink:#1B1F3B;--soft:#51557A;--accent:#4F3FD9;--tint:#E3E1FA;--line:#CFD1E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14162B;--ink:#EEEFFA;--soft:#A9ACD0;--accent:#9C90FF;--tint:#25285A;--line:#33376B}}
:root[data-theme="dark"]{--bg:#14162B;--ink:#EEEFFA;--soft:#A9ACD0;--accent:#9C90FF;--tint:#25285A;--line:#33376B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.65 "Source Serif 4",Georgia,serif}
h1,h2,h3,button,.sans{font-family:"Bricolage Grotesque",system-ui,sans-serif}
a,button{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
.theme{position:fixed;z-index:9;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);font-weight:700;font-size:14px;cursor:pointer}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:60px 0}
.hero>*{animation:rise .9s both}.hero p{animation-delay:.25s}.hero .cue{animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
h1{font-size:clamp(3.4rem,14vw,9rem);line-height:.9;margin:0 0 24px;font-weight:800;letter-spacing:-.03em}
.hero p{max-width:32em;font-size:1.25rem;margin:0 0 24px}
.cue{font:700 16px "Bricolage Grotesque",sans-serif;color:var(--accent)}
.story{height:600vh;position:relative}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.glow{position:absolute;inset:0;transition:opacity .8s}
.txt{position:absolute;left:0;right:0;top:11vh;display:grid;padding:0 24px;text-align:center}
.blk{grid-area:1/1;max-width:700px;margin:0 auto;will-change:opacity}
.blk .d{font:700 15px "Bricolage Grotesque",sans-serif;color:var(--c);margin:0}
.blk h2{font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.05;margin:6px 0;letter-spacing:-.02em}
.blk .r{margin:0 0 14px;color:var(--soft);font-size:1rem}
.blk ul{list-style:none;margin:0;padding:0;font-size:1rem}
.blk li{margin:5px 0}
.hint{position:absolute;left:0;right:0;bottom:33vh;text-align:center;font:700 14px "Bricolage Grotesque",sans-serif;color:var(--soft);transition:opacity .4s;pointer-events:none}
.chart{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:100%;height:32vh;max-height:300px}
.fig{cursor:pointer;outline:none}
.fig .in{transition:opacity .6s,transform .6s,filter .6s}
.fig.future .in{opacity:.18;filter:grayscale(1)}
.fig.active .in{transform:translateY(-10px)}
.fig:focus-visible .in{filter:drop-shadow(0 0 5px var(--accent))}
.lab{fill:var(--soft);font:500 15px "Bricolage Grotesque",sans-serif}.lab.active{fill:var(--ink);font-weight:800}
.trk{stroke:var(--c);transition:stroke .6s}
section.pad{padding:96px 0 0}
h2.sec{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 22px;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:15px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none;min-height:96px}
.chips li{padding:8px 16px;border-radius:999px;background:var(--tint);font:500 15px "Bricolage Grotesque",sans-serif;animation:rise .4s both}
.work{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.slot{min-height:180px;padding:22px;border:2px dashed var(--soft);border-radius:6px;display:flex;flex-direction:column;justify-content:flex-end}
.slot h3{margin:0 0 4px}.slot p{margin:0;color:var(--soft);font-size:16px}
.mail{font:700 clamp(1.2rem,4.5vw,2.2rem) "Bricolage Grotesque",sans-serif;word-break:break-all}
.copy{margin-left:10px;padding:8px 16px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer}
footer{margin-top:80px;border-top:1px solid var(--line);padding:22px 0;color:var(--soft);font-size:15px}
@media (prefers-reduced-motion:reduce){.fig .in,.glow,.hero>*,.chips li{transition:none;animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef}=React, h=React.createElement;
// Stage content: items marked (assumed) in the reply can be edited here.
const S=[
{y:"to 2017",d:"2005 – 2017",t:"Where the curiosity began",r:"School student · Kerala, India",c:"#E8A317",k:["Fell for books, stories and drawing","Grew up reading and writing in English and Malayalam","Started noticing how ideas get communicated"]},
{y:"2017–20",d:"2017 – 2020",t:"Learning to write",r:"B.A. English Language and Literature · St. Aloysius College, Thrissur",c:"#2BA39A",k:["Studied literature and the craft of writing","Certified in Television and Video Production (2020)","Completed a Content Writing certification"]},
{y:"2021–23",d:"2021 – 2023",t:"Moving into multimedia",r:"M.A. Multimedia · Little Flower College, Guruvayur",c:"#5B47E0",k:["Studied design, animation and moving image","Interned at MediaOne TV, Kozhikode (Mar–Apr 2022)","Wrote features and human-interest stories for broadcast and digital"]},
{y:"2023–24",d:"Sep 2023 – Nov 2024",t:"Teaching design",r:"Assistant Professor · Majlis Arts and Science College, Malappuram",c:"#D4507A",k:["Taught Graphic Design, Animation and Web Design","Built curriculum around design thinking and real-world projects","Led interdisciplinary projects with faculty"]},
{y:"2025–now",d:"Jan 2025 – Present",t:"Telling brand stories",r:"Social Media and Digital Marketing Executive · FMCG Brand, Dubai",c:"#3A6BE0",k:["Plan and run campaigns on Meta and TikTok","Create content in Photoshop, Illustrator and Canva","Turn performance reports into better content"]}];
const N=S.length, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const BODY=["#3B4A8C","#2BA39A","#2C2A6B","#D4507A","#3A6BE0"], SC=[.62,.82,.92,1,1];

function Fig({i,st,x,go}){
  const sk="#C98B5E",hr="#2A1B16",lg=i===0?"#F4F4FA":"#2A2F55",b=BODY[i];
  const arm=(x1,x2)=>h('line',{x1,y1:-98,x2,y2:-62,stroke:b,strokeWidth:9,strokeLinecap:'round'});
  return h('g',{transform:`translate(${x} 190) scale(${SC[i]})`,className:'fig '+st,tabIndex:0,role:'button','aria-label':'Go to '+S[i].t,
    onClick:()=>go(i),onKeyDown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i)}}},
    h('g',{className:'in'},
      i===0&&h('rect',{x:12,y:-106,width:26,height:46,rx:8,fill:'#E8A317'}),
      h('rect',{x:-12,y:-56,width:10,height:56,rx:4,fill:lg}),h('rect',{x:2,y:-56,width:10,height:56,rx:4,fill:lg}),
      arm(-20,-30),arm(20,30),
      h('rect',{x:-21,y:-110,width:42,height:60,rx:14,fill:b}),
      h('circle',{cy:-128,r:18,fill:sk}),
      h('path',{d:'M-19 -128A19 19 0 0 1 19 -128Q10 -141 0 -141Q-10 -141 -19 -128Z',fill:hr}),
      i>0&&h('circle',{cy:-148,r:7,fill:hr}),
      i===1&&h('rect',{x:-46,y:-86,width:24,height:28,rx:3,fill:'#fff',stroke:'#1B1F3B',strokeWidth:3}),
      i===2&&h('g',null,h('polygon',{points:'-28,-146 0,-160 28,-146 0,-132',fill:'#1B1F3B'}),h('line',{x1:24,y1:-147,x2:26,y2:-128,stroke:'#F2B33D',strokeWidth:3}),h('rect',{x:26,y:-80,width:6,height:32,rx:3,fill:'#F4E3B0'})),
      i===3&&h('g',null,h('circle',{cx:-8,cy:-128,r:6,fill:'none',stroke:'#1B1F3B',strokeWidth:2}),h('circle',{cx:8,cy:-128,r:6,fill:'none',stroke:'#1B1F3B',strokeWidth:2}),h('rect',{x:24,y:-84,width:22,height:30,rx:3,fill:'#fff',stroke:'#1B1F3B',strokeWidth:3})),
      i===4&&h('g',null,h('line',{x1:0,y1:-108,x2:0,y2:-80,stroke:'#fff',strokeWidth:3}),h('rect',{x:26,y:-84,width:12,height:22,rx:3,fill:'#1B1F3B'}),h('circle',{cx:44,cy:-152,r:9,fill:'#E8507A'}),h('circle',{cx:60,cy:-132,r:5,fill:'#F2B33D'}))
    ));
}

function Story(){
  const ref=useRef(),[p,setP]=useState(0);
  useEffect(()=>{let q;const f=()=>{cancelAnimationFrame(q);q=requestAnimationFrame(()=>{const el=ref.current;if(!el)return;
    setP(clamp(-el.getBoundingClientRect().top/(el.offsetHeight-innerHeight),0,1))})};
    f();addEventListener('scroll',f,{passive:true});addEventListener('resize',f);
    return()=>{removeEventListener('scroll',f);removeEventListener('resize',f)}},[]);
  const x=Math.min(p*N,N-.001),a=Math.floor(x);
  const go=i=>{const el=ref.current;scrollTo({top:el.getBoundingClientRect().top+scrollY+(el.offsetHeight-innerHeight)*(i+.5)/N,behavior:'smooth'})};
  const op=i=>{const u=x-i;if(u<0||u>1)return 0;return Math.min(i?clamp(u/.18,0,1):1,i<N-1?clamp((1-u)/.18,0,1):1)};
  const xm=clamp(100+200*(x-.5),40,960),narrow=innerWidth<640,vx=narrow?clamp(xm-250,0,500):0;
  return h('div',{className:'story',ref,id:'story'},
    h('div',{className:'pin',style:{'--c':S[a].c}},
      S.map((s,i)=>h('div',{className:'glow',key:i,style:{opacity:i===a?1:0,background:`radial-gradient(ellipse 85% 55% at 50% 100%,${s.c}44,transparent 70%)`}})),
      h('div',{className:'txt','aria-live':'polite'},S.map((s,i)=>{const o=op(i),u=x-i;
        return h('div',{className:'blk',key:i,style:{opacity:o,transform:`translateY(${(1-o)*14}px)`,'--c':s.c,visibility:o?'visible':'hidden'}},
          h('p',{className:'d'},s.d),h('h2',null,s.t),h('p',{className:'r'},s.r),
          h('ul',null,s.k.map((k,j)=>{const ko=o*clamp((u-(i?.1:0)-j*.09)/.12,0,1);return h('li',{key:j,style:{opacity:ko,transform:`translateY(${(1-ko)*8}px)`}},k)})))})),
      h('div',{className:'hint',style:{opacity:p<.02?1:0}},'Keep scrolling to follow her journey'),
      h('svg',{className:'chart',viewBox:`${vx} 0 ${narrow?500:1000} 250`,preserveAspectRatio:'xMidYMax meet',role:'group','aria-label':'Evolution chart of Ameena\'s career'},
        h('line',{x1:40,y1:196,x2:960,y2:196,stroke:'var(--line)',strokeWidth:4,strokeLinecap:'round'}),
        h('line',{className:'trk',x1:40,y1:196,x2:xm,y2:196,strokeWidth:4,strokeLinecap:'round'}),
        h('circle',{className:'trk',cx:xm,cy:196,r:7,fill:'var(--bg)',strokeWidth:4}),
        S.map((s,i)=>{const st=i<a?'done':i===a?'active':'future',cx=100+200*i;
          return h('g',{key:i},h(Fig,{i,st,x:cx,go}),h('text',{x:cx,y:226,textAnchor:'middle',className:'lab '+(i===a?'active':'')},s.y))}))));
}

const SK={Educator:["Curriculum and training content","Graphic Design teaching","Animation teaching","Web Design teaching","Project-based learning","Student and stakeholder engagement"],
Communicator:["Institutional and internal communications","Social media management","Content creation and editorial writing","Video production and AI content tools","Campaign reporting and analytics"],
Tools:["Adobe Photoshop","Adobe Illustrator","Canva","Meta (Facebook and Instagram)","TikTok"]};

function Skills(){
  const [t,setT]=useState('Educator');
  return h('section',{className:'pad',id:'skills'},h('h2',{className:'sec'},'What she brings'),
    h('div',{className:'tabs'},Object.keys(SK).map(k=>h('button',{key:k,className:'tab','aria-pressed':t===k,onClick:()=>setT(k)},k))),
    h('ul',{className:'chips',key:t},SK[t].map(s=>h('li',{key:s},s))));
}

function Contact(){
  const [ok,setOk]=useState(false),m='ameenapk3011@gmail.com';
  const copy=()=>{try{navigator.clipboard.writeText(m).then(()=>setOk(true))}catch(e){setOk(false)};setTimeout(()=>setOk(false),2000)};
  return h('section',{className:'pad',id:'contact'},h('h2',{className:'sec'},'Contact'),
    h('p',null,h('a',{className:'mail',href:'mailto:'+m},m),h('button',{className:'copy',onClick:copy},ok?'Copied':'Copy email')),
    h('p',null,h('a',{href:'tel:+971509716093'},'+971 50 971 6093'),' | Dubai, UAE'));
}

function App(){
  const toggle=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};
  return h(React.Fragment,null,
    h('button',{className:'theme',onClick:toggle,'aria-label':'Switch light or dark theme'},'Theme'),
    h('div',{className:'wrap'},h('header',{className:'hero'},
      h('h1',null,'Ameena PK'),
      h('p',null,'Educator and communicator. I teach design, run digital content, and help institutions tell their story.'),
      h('div',{className:'cue'},'Scroll to follow her journey, from school to today'))),
    h(Story),
    h('div',{className:'wrap'},h(Skills),
      h('section',{className:'pad',id:'work'},h('h2',{className:'sec'},'Selected work'),
        h('div',{className:'work'},['Social media campaign','Student design projects','Articles and video'].map(n=>h('div',{className:'slot',key:n},h('h3',null,n),h('p',null,'Placeholder until Ameena shares samples.'))))),
      h(Contact),h('footer',null,'\u00A9 2026 Ameena PK')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
