    h('ul',{className:'chips',key:t},SK[t].map(s=>h('li',{key:s},s))));}

function Contact(){const [ok,setOk]=useState(false);
  const copy=()=>{try{navigator.clipboard.writeText(MAIL).then(()=>setOk(true))}catch(e){};setTimeout(()=>setOk(false),2000)};
  return h('section',{className:'pad',id:'contact'},h('h2',{className:'sec'},C.contact.title),
    h('p',{className:'sub'},C.contact.intro),
    h('div',{className:'ctas'},h('a',{className:'btn',href:WA,target:'_blank',rel:'noopener'},C.contact.whatsappLabel),h('a',{className:'btn alt',href:'mailto:'+MAIL+'?subject=Portfolio%20enquiry'},C.contact.emailLabel),h('button',{className:'btn alt',onClick:copy},ok?'Copied':'Copy email')),
    h('p',null,h('span',{className:'mail'},MAIL)));}

function App(){
  const toggle=()=>{const r=document.documentElement,c=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=c==='dark'?'light':'dark'};
  return h(React.Fragment,null,h('button',{className:'theme',onClick:toggle,'aria-label':'Switch light or dark theme'},'Theme'),
    h('main',null,h('div',{className:'wrap'},h('header',{className:'hero'},
      h('p',{className:'eyebrow'},C.hero.eyebrow),h('h1',null,C.hero.title),
      h('p',{className:'lead'},C.hero.lead),
      h('div',{className:'ctas'},h('a',{className:'btn',href:WA,target:'_blank',rel:'noopener'},C.hero.cta1),h('a',{className:'btn alt',href:'#story'},C.hero.cta2)),
      h('div',{className:'strip'},C.stats.map(x=>h('div',{key:x.label,className:'stat'+(x.ph?' ph':'')},h('b',null,x.value),h('span',null,x.label)))))),
    h(Story),
    h('div',{className:'wrap'},
      h(Work),
      h('section',{className:'pad',id:'work'},h('h2',{className:'sec'},C.brands.title),h('p',{className:'sub'},C.brands.intro),
        h('ul',{className:'brands'},B.map(({name:n,handle:u})=>h('li',{key:u},h('a',{href:'https://www.instagram.com/'+u+'/',target:'_blank',rel:'noopener'},n,h('small',null,'@'+u)))))),
      h(Skills),
      h('section',{className:'pad',id:'moments'},h('h2',{className:'sec'},C.moments.title),h('p',{className:'sub'},C.moments.intro),h('div',{className:'gal'},GAL.map(m=>h(Media,{key:m.alt,m,cap:true})))),
      h(Contact),h('footer',null,C.footer))));
}
fetch('work/content.json').then(r=>r.json()).then(c=>{C=c;S=c.stages;N=S.length;BODY=S.map(x=>x.c);B=c.brands.items;SK=c.skills;GAL=c.moments.items;
  MAIL=c.contact.email;WA='https://wa.me/'+c.contact.whatsapp+'?text='+encodeURIComponent(c.contact.waText);
  ReactDOM.createRoot(document.getElementById('root')).render(h(App))}).catch(()=>{document.getElementById('root').textContent='Ameena PK. Content could not load. Please email me@ameenapk.art.'});
</script>
