name: Update image manifests
on:
  push:
    branches: [main]   # change to master if that is your branch
    paths: ['work/brands/**', 'work/school-posters/**']
permissions:
  contents: write
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow && python scripts/build-manifests.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          git diff --cached --quiet || (git commit -m "Update image manifests" && git push)
